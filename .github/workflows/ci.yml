name: NodePress CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nodepress-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm audit --audit-level=high --omit=dev --omit=optional
      - run: npm run build
